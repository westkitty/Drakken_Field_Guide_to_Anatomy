name: Validate build-skymourn

on:
  push:
    branches:
      - build-skymourn
  pull_request:
    branches:
      - build-skymourn
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-adversarial-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/immersive-ui-model-quality-20260803' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair temporary applicator quoting
        run: node scripts/fix-polish-applicator.mjs

      - name: Apply bounded adversarial repair
        run: node scripts/apply-polish-pass.mjs

      - name: Commit repaired implementation
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/polish.css src/polish.test.ts src/polishManifest.ts POLISH_PASS.md
            git commit -m "fix: implement adversarial polish findings"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Strict static audit
        run: node scripts/audit-static.mjs --strict

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
