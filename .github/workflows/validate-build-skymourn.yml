name: Validate build-skymourn

on:
  push:
    branches:
      - build-skymourn
  pull_request:
    branches:
      - build-skymourn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Strict static audit
        run: node scripts/audit-static.mjs --strict

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  browser-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/immersive-ui-model-quality-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        start: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install ephemeral browser harness
        run: |
          mkdir -p /tmp/drakken-browser-audit
          cp scripts/immersive-browser-audit.mjs /tmp/drakken-browser-audit/audit.mjs
          cd /tmp/drakken-browser-audit
          npm init -y >/dev/null
          PUPPETEER_CACHE_DIR=/tmp/puppeteer-cache npm install puppeteer@24.16.0 --no-save --no-package-lock

      - name: Run record shard
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/drakken-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill ${VITE_PID} 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null
          cd /tmp/drakken-browser-audit
          PUPPETEER_CACHE_DIR=/tmp/puppeteer-cache \
          DRAKKEN_AUDIT_URL=http://127.0.0.1:4173 \
          DRAKKEN_AUDIT_START=${{ matrix.start }} \
          DRAKKEN_AUDIT_COUNT=5 \
          DRAKKEN_AUDIT_OUTPUT=${GITHUB_WORKSPACE}/browser-audit-output-${{ matrix.start }} \
          node audit.mjs

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drakken-browser-audit-${{ matrix.start }}
          path: browser-audit-output-${{ matrix.start }}
          if-no-files-found: warn