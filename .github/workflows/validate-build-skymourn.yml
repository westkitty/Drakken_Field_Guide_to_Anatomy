name: Validate build-skymourn

on:
  push:
    branches:
      - build-skymourn
  pull_request:
    branches:
      - build-skymourn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply bounded repair
        if: github.event_name == 'pull_request' && github.head_ref == 'repair/immersive-ui-model-quality-20260803'
        run: |
          node scripts/apply-immersive-model-repair.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/components/ExaminationChamber.tsx src/scene/SpecimenRouter.tsx src/immersive-shell.css
            git commit -m "feat: apply immersive UI and model enhancement integration"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Strict static audit
        run: |
          if [ -f scripts/audit-static.mjs ]; then
            node scripts/audit-static.mjs --strict
          else
            echo "No static audit script present."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build