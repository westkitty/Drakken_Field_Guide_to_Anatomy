name: Validate build-skymourn

on:
  push:
    branches:
      - build-skymourn
  pull_request:
    branches:
      - build-skymourn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/exhaustive-bug-sweep-20260803'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Apply pending bounded repair script
        run: |
          if [ ! -f scripts/apply-audit-build-fixes.mjs ]; then
            echo "No pending audit repair script."
            exit 0
          fi
          node scripts/apply-audit-build-fixes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Repair build-blocking curve and toolchain defects"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Static audit snapshot
        run: |
          if [ -f scripts/audit-static.mjs ]; then
            node scripts/audit-static.mjs
          else
            echo "No static audit script present."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
