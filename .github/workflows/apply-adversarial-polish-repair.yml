name: Apply adversarial polish repair

on:
  push:
    branches:
      - repair/immersive-ui-model-quality-20260803

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: repair/immersive-ui-model-quality-20260803
          fetch-depth: 0

      - name: Apply bounded adversarial repair
        run: node scripts/apply-polish-pass.mjs

      - name: Commit repaired implementation
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/polish.css src/polish.test.ts src/polishManifest.ts POLISH_PASS.md
            git commit -m "fix: implement adversarial polish findings"
            git push origin HEAD:repair/immersive-ui-model-quality-20260803
          fi
