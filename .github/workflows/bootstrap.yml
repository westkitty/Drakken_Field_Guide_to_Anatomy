name: Bootstrap Skymourn Archive

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-skymourn
          fetch-depth: 0

      - name: Restore source tree
        shell: bash
        run: |
          cat .bootstrap/chunk-* > /tmp/dfaa.b64
          base64 --decode /tmp/dfaa.b64 > /tmp/dfaa.tar.gz
          tar -xzf /tmp/dfaa.tar.gz -C .
          rm -rf .bootstrap

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Skymourn field anatomy archive"
          git push origin HEAD:build-skymourn
